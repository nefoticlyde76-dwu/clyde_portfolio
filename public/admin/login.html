<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#09090B">
    <title>Administrator sign in | Clyde Nefoti</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Caveat:wght@500;600&family=Inter:wght@400;500;600;700&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="/assets/css/app.css">
    <link rel="stylesheet" href="/assets/css/admin.css">
    <link rel="stylesheet" href="/assets/css/admin-auth.css">
    <script src="/assets/js/admin-auth.js" defer></script>
</head>
<body class="admin-body admin-guest-body">
    <a class="skip-link" href="#content">Skip to content</a>
    <main id="content" class="admin-guest" data-auth-page="login">
        <section class="admin-guest-card" aria-labelledby="page-title">
            <p class="eyebrow">Private</p>
            <h1 id="page-title">Sign in</h1>
            <p class="lede">This account is created from the command line. There is no public registration.</p>
            <p id="auth-status" class="admin-auth-status" role="status" aria-live="polite" hidden></p>
            <form id="login-form" class="stack-form admin-auth-form" action="/api/admin/auth/login" method="post">
                <label for="email">Username</label>
                <input id="email" name="email" type="text" autocomplete="username" required maxlength="190" spellcheck="false" autocapitalize="off" aria-describedby="auth-status">
                <label for="password">Password</label>
                <input id="password" name="password" type="password" autocomplete="current-password" required aria-describedby="auth-status">
                <button id="submit-button" type="submit" class="btn btn-slate">Sign in</button>
            </form>
        </section>
    </main>
</body>
</html>
