<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#282B4A">
    <title>Administration | Clyde Nefoti</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="/assets/css/admin-dashboard.css">
    <script src="/assets/js/admin-dashboard.js" defer></script>
</head>
<body class="dashboard-body">
    <a class="skip-link" href="#admin-main">Skip to content</a>
    <div class="dashboard-shell">
        <aside class="dashboard-sidebar" aria-label="Administration">
            <a class="dashboard-brand" href="/admin" aria-label="Clyde Nefoti administration overview">
                <span class="brand-mark" aria-hidden="true">CN</span>
                <span><strong>CLYDE NEFOTI</strong><small>Portfolio admin</small></span>
            </a>
            <nav class="dashboard-nav" id="dashboard-nav" aria-label="Dashboard">
                <p class="nav-caption">Workspace</p>
                <button type="button" data-section="overview" aria-current="page">Overview</button>
                <button type="button" data-section="profile">Profile settings</button>
                <button type="button" data-section="projects">Projects</button>
                <button type="button" data-section="certificates">Certificates</button>
                <button type="button" data-section="designs">Graphic design</button>
                <button type="button" data-section="skills">Skills</button>
                <button type="button" data-section="experience">Experience</button>
                <button type="button" data-section="messages">Contact messages</button>
                <button type="button" data-section="media">Media and CV</button>
                <p class="nav-caption nav-caption-account">Account</p>
                <button type="button" class="nav-signout" data-action="logout">Sign out</button>
            </nav>
            <a class="public-site-link" href="/">View portfolio</a>
        </aside>

        <div class="dashboard-content">
            <header class="dashboard-topbar">
                <button class="menu-toggle" type="button" aria-controls="dashboard-nav" aria-expanded="false">
                    <span aria-hidden="true">Menu</span>
                    <span class="visually-hidden">Toggle dashboard navigation</span>
                </button>
                <div class="session-label">
                    <span class="session-dot" aria-hidden="true"></span>
                    <span id="session-name">Checking administrator session…</span>
                </div>
                <button type="button" class="button button-outline topbar-signout" data-action="logout">Sign out</button>
            </header>
            <main id="admin-main" class="dashboard-main" tabindex="-1">
                <div id="admin-feedback" class="feedback" role="status" aria-live="polite" hidden></div>
                <div id="admin-view" aria-busy="true">
                    <p class="loading-state">Checking your administrator session…</p>
                </div>
            </main>
        </div>
    </div>
</body>
</html>
