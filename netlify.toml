[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[dev]
  port = 8888

[[redirects]]
  from = "/api/health"
  to = "/.netlify/functions/health"
  status = 200
  force = true

[[redirects]]
  from = "/api/admin/setup"
  to = "/.netlify/functions/admin-setup"
  status = 200
  force = true

[[redirects]]
  from = "/api/admin/auth/login"
  to = "/.netlify/functions/admin-auth-login"
  status = 200
  force = true

[[redirects]]
  from = "/api/admin/auth/me"
  to = "/.netlify/functions/admin-auth-me"
  status = 200
  force = true

[[redirects]]
  from = "/api/admin/auth/logout"
  to = "/.netlify/functions/admin-auth-logout"
  status = 200
  force = true

[[redirects]]
from = "/api/admin/content"
to = "/.netlify/functions/admin-content"
status = 200
force = true

[[redirects]]
from = "/api/admin/media"
to = "/.netlify/functions/admin-media"
status = 200
force = true

[[redirects]]
from = "/api/public/content"
to = "/.netlify/functions/public-content"
status = 200
force = true

[[redirects]]
from = "/api/public/contact"
to = "/.netlify/functions/public-contact"
status = 200
force = true

[[redirects]]
from = "/api/public/media"
to = "/.netlify/functions/public-media"
status = 200
force = true

[[redirects]]
from = "/admin"
to = "/admin/index.html"
status = 200
force = true

[[redirects]]
from = "/admin/login"
to = "/admin/login.html"
status = 200
force = true

[[redirects]]
from = "/sitemap.xml"
to = "/.netlify/functions/public-sitemap"
status = 200
force = true

[[redirects]]
from = "/robots.txt"
to = "/.netlify/functions/public-robots"
status = 200
force = true

[[redirects]]
from = "/*"
to = "/index.html"
status = 200
